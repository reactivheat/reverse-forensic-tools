[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reverse-forensic-tools"
version = "1.0.0"
description = "A comprehensive Python toolkit for Reverse Engineering and Digital Forensic analysis"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Operator Cedra"}]
keywords = [
    "reverse-engineering", "digital-forensics", "malware-analysis",
    "binary-analysis", "disassembly", "decompilation", "forensics", "security"
]
dependencies = [
    "capstone>=4.0.0",
    "keystone-engine>=0.9.2",
    "pefile>=2023.2.7",
    "pyelftools>=0.29",
    "unicorn>=2.0.0",
    "volatility3>=2.0.0",
    "scapy>=2.5.0",
    "pyts>=0.12.0",
    "artifacts>=2023.1.0",
    "yara-python>=4.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
    "psutil>=5.9.0",
    "python-magic>=0.4.27",
    "python-magic-bin>=0.4.14; sys_platform == \"win32\"",
    "protobuf>=4.21.0",
    "rich>=13.0.0",
    "click>=8.1.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
rft = "core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yar", "*.md", "*.html"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
python_files = "test_*.py"
testpaths = ["src/tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]


